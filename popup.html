<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Karotter UI Fix 設定</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      background: #0c0c10;
      color: #e0e0ec;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      overflow-x: hidden;
    }

    /* ── ヘッダー ── */
    .header {
      padding: 12px 16px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-logo {
      width: 22px; height: 22px; border-radius: 6px;
      background: linear-gradient(135deg, #4a9eff, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; color: #fff; flex-shrink: 0;
    }
    .header-title { font-size: 14px; font-weight: 700; color: #fff; }
    .header-ver   { margin-left: auto; font-size: 10px; color: rgba(255,255,255,.28); }

    /* ── タブ ── */
    .tabs {
      display: flex;
      padding: 10px 16px 0;
      gap: 4px;
    }
    .tab {
      flex: 1; padding: 7px 0;
      background: none;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      color: rgba(255,255,255,.45);
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .tab:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.7); }
    .tab.active {
      background: rgba(74,158,255,.15);
      border-color: rgba(74,158,255,.45);
      color: #4a9eff;
    }

    /* ── タブコンテンツ ── */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── セクション（機能タブ） ── */
    .section       { padding: 10px 16px 4px; }
    .section-label {
      font-size: 10px; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; color: rgba(255,255,255,.3);
      margin-bottom: 8px;
    }
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; border-radius: 8px; margin-bottom: 3px;
      cursor: pointer; transition: background .12s; gap: 10px;
    }
    .toggle-row:hover { background: rgba(255,255,255,.05); }
    .toggle-text { flex: 1; }
    .toggle-name  { font-size: 13px; font-weight: 500; color: #e0e0ec; line-height: 1.3; }
    .toggle-desc  { font-size: 11px; color: rgba(255,255,255,.35); margin-top: 1px; line-height: 1.3; }
    .toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .slider {
      position: absolute; inset: 0; background: rgba(255,255,255,.12);
      border-radius: 20px; transition: background .18s; cursor: pointer;
    }
    .slider::before {
      content: ''; position: absolute;
      width: 14px; height: 14px; border-radius: 50%; background: #fff;
      left: 3px; top: 3px; transition: transform .18s;
    }
    input:checked + .slider { background: #4a9eff; }
    input:checked + .slider::before { transform: translateX(16px); }
    .divider { height: 1px; background: rgba(255,255,255,.06); margin: 5px 16px; }

    /* ── キーバインドタブ ── */
    .kb-scroll {
      max-height: 380px;
      overflow-y: auto;
      padding: 8px 0;
    }
    .kb-scroll::-webkit-scrollbar { width: 4px; }
    .kb-scroll::-webkit-scrollbar-track { background: transparent; }
    .kb-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 2px; }

    .kb-category-label {
      font-size: 10px; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; color: rgba(255,255,255,.28);
      padding: 6px 16px 4px;
    }

    .kb-row {
      display: flex; align-items: center;
      padding: 6px 12px 6px 16px;
      border-radius: 8px; margin: 1px 8px;
      transition: background .12s;
      cursor: pointer;
      gap: 8px;
    }
    .kb-row:hover { background: rgba(255,255,255,.05); }
    .kb-row.capturing {
      background: rgba(74,158,255,.12);
      outline: 1px solid rgba(74,158,255,.35);
    }

    .kb-label {
      flex: 1; font-size: 12px; color: rgba(255,255,255,.75);
      pointer-events: none;
    }

    .kb-badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 7px; border-radius: 5px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 11px; font-weight: 600; color: rgba(255,255,255,.8);
      font-family: 'SF Mono', 'Consolas', monospace;
      white-space: nowrap; pointer-events: none;
      min-width: 28px; text-align: center;
    }
    .kb-badge.unset { color: rgba(255,255,255,.25); border-style: dashed; font-family: inherit; font-weight: 400; }
    .kb-badge.capturing-hint {
      background: rgba(74,158,255,.15); border-color: rgba(74,158,255,.5);
      color: #4a9eff; font-family: inherit; font-weight: 500; font-size: 10px;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

    .kb-clear {
      width: 20px; height: 20px; border-radius: 50%;
      border: none; background: none; color: rgba(255,255,255,.25);
      cursor: pointer; font-size: 14px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s, color .12s;
      flex-shrink: 0;
    }
    .kb-clear:hover { background: rgba(255,100,100,.2); color: rgba(255,100,100,.9); }

    /* ── フッター ── */
    .footer {
      padding: 10px 16px 14px;
      display: flex; gap: 8px;
    }
    .btn-save {
      flex: 1; padding: 8px;
      background: #4a9eff; color: #fff;
      border: none; border-radius: 8px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: background .15s;
    }
    .btn-save:hover { background: #2e86f0; }
    .btn-reset {
      padding: 8px 12px;
      background: rgba(255,255,255,.07); color: rgba(255,255,255,.5);
      border: none; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    .btn-reset:hover { background: rgba(255,255,255,.12); }

    .saved-notice {
      text-align: center; font-size: 11px; color: #4ade80;
      padding: 0 16px 10px; display: none;
    }
    .saved-notice.show { display: block; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-logo">K</div>
    <span class="header-title">Karotter UI Fix</span>
    <span class="header-ver">v1.2</span>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="features">機能</button>
    <button class="tab"        data-tab="keybindings">キーバインド</button>
  </div>

  <!-- 機能タブ -->
  <div id="tab-features" class="tab-content active">
    <div class="section">
      <div class="section-label">表示・レイアウト</div>
      <label class="toggle-row" for="widthFix">
        <div class="toggle-text">
          <div class="toggle-name">タイムライン幅拡張</div>
          <div class="toggle-desc">横幅の上限を解除してフル幅表示</div>
        </div>
        <div class="toggle"><input type="checkbox" id="widthFix" checked><span class="slider"></span></div>
      </label>
      <label class="toggle-row" for="modalResize">
        <div class="toggle-text">
          <div class="toggle-name">投稿モーダルリサイズ</div>
          <div class="toggle-desc">作成ダイアログをウィンドウに合わせて拡大</div>
        </div>
        <div class="toggle"><input type="checkbox" id="modalResize" checked><span class="slider"></span></div>
      </label>
      <label class="toggle-row" for="mentionFix">
        <div class="toggle-text">
          <div class="toggle-name">メンション候補位置修正</div>
          <div class="toggle-desc">@入力時のポップアップをカーソル位置に表示</div>
        </div>
        <div class="toggle"><input type="checkbox" id="mentionFix" checked><span class="slider"></span></div>
      </label>
    </div>
    <div class="divider"></div>
    <div class="section">
      <div class="section-label">操作</div>
      <label class="toggle-row" for="scrollBtns">
        <div class="toggle-text">
          <div class="toggle-name">スクロールボタン（↑↓）</div>
          <div class="toggle-desc">画面端に表示するフロートボタン</div>
        </div>
        <div class="toggle"><input type="checkbox" id="scrollBtns" checked><span class="slider"></span></div>
      </label>
      <label class="toggle-row" for="keyboardShortcuts">
        <div class="toggle-text">
          <div class="toggle-name">キーボードショートカット</div>
          <div class="toggle-desc">Shift+↑ / Shift+↓ のスクロールショートカットを有効化</div>
        </div>
        <div class="toggle"><input type="checkbox" id="keyboardShortcuts" checked><span class="slider"></span></div>
      </label>
    </div>
    <div class="divider"></div>
    <div class="section">
      <div class="section-label">連携</div>
      <label class="toggle-row" for="twitterBtn">
        <div class="toggle-text">
          <div class="toggle-name">「Xに投稿」ボタン</div>
          <div class="toggle-desc">投稿作成画面に同文をXへ投稿するボタンを追加</div>
        </div>
        <div class="toggle"><input type="checkbox" id="twitterBtn" checked><span class="slider"></span></div>
      </label>
    </div>
  </div>

  <!-- キーバインドタブ -->
  <div id="tab-keybindings" class="tab-content">
    <div class="kb-scroll" id="kbList">
      <!-- JS で生成 -->
    </div>
  </div>

  <div class="footer">
    <button class="btn-save"  id="btnSave">保存</button>
    <button class="btn-reset" id="btnReset">リセット</button>
  </div>
  <div class="saved-notice" id="savedNotice">✓ 設定を保存しました</div>

  <script src="popup.js"></script>
</body>
</html>
